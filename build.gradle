plugins {
    id 'fabric-loom'
    id 'maven-publish'
}

// Ensure these are in your gradle.properties:
// loom_version=1.9.2
// minecraft_version=1.21.11

loom {
    splitEnvironmentSourceSets()

    // Correct syntax for Loom 1.9.2 to stop the Unpick/Javadoc crash
    unpick.enabled = false

    mods {
        // This MUST match the "id" in your fabric.mod.json exactly
        // Use the UNDERSCORE version: "crappy_achievements"
        "crappy_achievements" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

// THIS IS THE CRITICAL MISSING PIECE:
// It bridges the classpath so the 'client' folder can see 'ResourceLocation'
configurations {
    clientImplementation.extendsFrom implementation
    clientRuntimeOnly.extendsFrom runtimeOnly
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}