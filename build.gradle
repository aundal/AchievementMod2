plugins {
    // Both 'fabric-loom' and 'net.fabricmc.fabric-loom-remap' work with 1.9.2
    // Ensure this matches your settings.gradle
    id 'fabric-loom'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    splitEnvironmentSourceSets()

    // Correct way to disable unpick in Loom 1.9+ to fix the Javadoc error
    unpickEnabled = false

    mods {
        // MUST match "crappy_achievements" from your fabric.mod.json
        "crappy_achievements" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

// Bridges the classpath so 'src/client/java' can see Minecraft
configurations {
    clientImplementation.extendsFrom implementation
    clientRuntimeOnly.extendsFrom runtimeOnly
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

// Ensure AchievementPayload.java is moved to src/main/java/com/example/