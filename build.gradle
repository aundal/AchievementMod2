plugins {
    id 'fabric-loom'
    id 'maven-publish'
}

// Ensure these are in your gradle.properties:
// loom_version=1.9.2
// minecraft_version=1.21.11

loom {
    splitEnvironmentSourceSets()

    // Required to prevent the Javadoc/Unpick crash in 1.21.11
    unpick.enabled = false

    mods {
        // This MUST match the "id" in your fabric.mod.json (crappy_achievements)
        "crappy_achievements" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

// THIS IS THE BRIDGE: 
// It forces the 'client' folder to inherit the Minecraft libraries from 'main'
configurations {
    clientImplementation.extendsFrom implementation
    clientRuntimeOnly.extendsFrom runtimeOnly
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}