pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

// This allows build.gradle to use the version without hardcoding it
plugins {
    id 'fabric-loom' version "${loom_version}"
}

rootProject.name = "Crappy-Achievements"
